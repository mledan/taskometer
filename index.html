<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="taskometer — shape your day, loop it forward." />
    <meta name="theme-color" content="#FAF3EB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1A16" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo128.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>taskometer</title>
    <style>
      /* Pre-stylesheet paint: match the theme so there's no flash. */
      :root { --boot-paper: #FAF3EB; --boot-ink: #4A433C; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { --boot-paper: #1C1A16; --boot-ink: #CFC6B9; }
      }
      :root[data-theme="dark"] { --boot-paper: #1C1A16; --boot-ink: #CFC6B9; }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--boot-paper);
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #loading {
        margin: 40px auto;
        font-weight: 500;
        color: var(--boot-ink);
        text-align: center;
        font-size: 19px;
      }
    </style>
    <script>
      // Apply the saved theme before first paint so dark users never see a cream flash.
      try {
        var t = localStorage.getItem('taskometer-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div id="loading">loading...</div>
    </div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
